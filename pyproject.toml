[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "stakeholder-intelligence-agent"
version = "0.1.0"
description = "Local multi-agent stakeholder intelligence system with traceable evidence."
readme = "README.md"
requires-python = ">=3.12.13,<3.13"
dependencies = [
  "aiosqlite==0.22.1",
  "cryptography==49.0.0",
  "deepagents==0.6.12",
  "docling==2.113.0",
  "fastapi==0.139.0",
  "fastembed==0.8.0",
  "httpx==0.28.1",
  "huggingface-hub==1.23.0",
  "langchain==1.3.13",
  "langchain-core==1.4.9",
  "langchain-google-genai==4.2.7",
  "langchain-qdrant==1.1.0",
  "langgraph==1.2.9",
  "langgraph-checkpoint-sqlite==3.1.0",
  "numpy==2.5.1",
  "openpyxl==3.1.5",
  "pillow==12.3.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "pypdfium2==5.11.0",
  "python-multipart==0.0.32",
  "python-pptx==1.0.2",
  "qdrant-client==1.18.0",
  "sentence-transformers==5.6.0",
  "torch==2.13.0",
]

[dependency-groups]
dev = [
  "bandit==1.9.4",
  "hypothesis==6.156.6",
  "langgraph-api==0.11.0",
  "langgraph-checkpoint-conformance==0.0.2",
  "langgraph-cli[inmem]==0.4.31",
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "playwright==1.61.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "pytest-mock==3.15.1",
  "pytest-playwright==0.8.0",
  "pytest-timeout==2.4.0",
  "respx==0.23.1",
  "ruff==0.15.21",
]

[tool.uv]
required-version = "==0.11.28"
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/stakeholder_intelligence_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
exclude = [".cache", ".tools", ".venv", "data", "models", "ui-gate-workspace"]

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "DTZ",
  "E",
  "ERA",
  "F",
  "FAST",
  "FLY",
  "FURB",
  "I",
  "INP",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "T10",
  "T20",
  "TC",
  "TRY",
  "UP",
  "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101"]
"tests/e2e/conftest.py" = ["TRY003"]
"src/stakeholder_intelligence_agent/api/app.py" = ["PLR0915"]
"tests/acceptance/test_business_scenarios.py" = ["PLR0912", "PLR0913", "PLR0915"]
"tests/integration/test_ingestion_crash_recovery.py" = ["PLR0912", "PLR0915"]
"scripts/*.py" = ["T201"]
"src/stakeholder_intelligence_agent/config.py" = ["TRY003"]
"src/stakeholder_intelligence_agent/contracts/*.py" = ["TC001", "TC003", "TRY003"]
"src/stakeholder_intelligence_agent/access/service.py" = ["PLR0913"]
"src/stakeholder_intelligence_agent/insight/graph.py" = ["PLC0415", "TC002"]
"src/stakeholder_intelligence_agent/insight/observability.py" = ["PLR0913"]
"src/stakeholder_intelligence_agent/insight/repository.py" = ["PLR0913", "TRY003"]
"src/stakeholder_intelligence_agent/insight/service.py" = ["TRY301"]
"src/stakeholder_intelligence_agent/insight/prompts.py" = ["E501"]
"src/stakeholder_intelligence_agent/insight/tools.py" = ["PLR0912", "PLR0915", "TC001", "TC002", "TC003"]
"src/stakeholder_intelligence_agent/interview/graph.py" = ["PLC0415", "TC001", "TC002"]
"src/stakeholder_intelligence_agent/interview/ingestion.py" = ["PLR0913"]
"src/stakeholder_intelligence_agent/interview/middleware.py" = ["TC002"]
"src/stakeholder_intelligence_agent/interview/repository.py" = ["PLR0913", "PLR2004", "TRY003"]
"src/stakeholder_intelligence_agent/interview/tools.py" = ["TC001", "TC002"]
"src/stakeholder_intelligence_agent/interview/prompts.py" = ["E501"]
"src/stakeholder_intelligence_agent/middleware/course_fidelity.py" = ["TC001", "TC002", "TC003"]
"src/stakeholder_intelligence_agent/middleware/runtime_scope.py" = ["TC002"]
"src/stakeholder_intelligence_agent/persistence/checkpointer.py" = ["TC002", "TC003"]
"src/stakeholder_intelligence_agent/ingestion/docling_adapter.py" = ["SLF001"]
"src/stakeholder_intelligence_agent/ingestion/repository.py" = ["PLR0913", "TRY003"]
"src/stakeholder_intelligence_agent/ingestion/service.py" = ["PLC0415", "PLR0913", "PLR0915", "TRY003"]
"src/stakeholder_intelligence_agent/ingestion/validation.py" = ["TRY301"]
"src/stakeholder_intelligence_agent/retrieval/qdrant.py" = ["PLR0913"]
"src/stakeholder_intelligence_agent/retrieval/evidence.py" = ["PLR0913"]
"src/stakeholder_intelligence_agent/retrieval/repository.py" = ["PLR0913", "TRY003"]
"src/stakeholder_intelligence_agent/retrieval/service.py" = ["PLR0913", "PLR0915"]
"scripts/fixtures/generate_binary_fixtures.py" = ["PLR0913", "PLR0915", "SLF001", "T201"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]
show_error_codes = true
show_column_numbers = true
warn_unreachable = true
exclude = ["ui-gate-workspace", "data", "models"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
  "docling.*",
  "docling_core.*",
  "fastembed.*",
  "openpyxl.*",
  "pptx.*",
  "pypdfium2.*",
  "reportlab.*",
  "sentence_transformers.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scripts.fixtures.generate_binary_fixtures"]
disable_error_code = ["attr-defined", "unused-ignore", "valid-type"]

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 30
markers = [
  "unit: isolated deterministic unit tests",
  "contract: canonical schema and lifecycle contract tests",
  "integration: tests using local persistence, Qdrant, or Agent Server boundaries",
  "security: authorization, isolation, hostile-input, token, and disclosure tests",
  "trajectory: instrumented agent and course-fidelity execution tests",
  "e2e: complete selected-UI business-flow tests",
  "evaluation: retrieval relevance and latency evaluation",
  "live: credential-gated real Gemini tests",
  "slow: tests that load local models or process representative documents",
]

[tool.coverage.run]
branch = true
source = ["stakeholder_intelligence_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.bandit]
exclude_dirs = [".cache", ".tools", ".venv", "data", "models", "tests", "ui-gate-workspace"]
skips = ["B101"]
